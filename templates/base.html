<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{% block descripcion %}Portfolio de José Antonio{% endblock %}">
  <title>{% block titulo %}Portfolio{% endblock %}</title>
  <script>
    document.documentElement.classList.add('js');
    try {
      var tema = localStorage.getItem('tema');
      if (tema === 'light' || tema === 'dark') {
        document.documentElement.setAttribute('data-theme', tema);
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ estatico('css/style.css') }}">
</head>

<body class="{% block clase_body %}{% endblock %}">
{% block cuerpo %}{% endblock %}
  <script src="{{ estatico('js/main.js') }}" defer></script>
</body>

</html>
